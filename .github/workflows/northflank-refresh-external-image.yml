name: b94-Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Northflank service
        run: |
          # Replace a86 and b94 with your own Northflank project ID and service ID.
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.northflank.com/v1/projects/a86/services/b94/restart"
